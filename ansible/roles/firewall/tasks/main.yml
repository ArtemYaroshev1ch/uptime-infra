- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

# The ssh rule goes in before ufw is enabled, so enabling it never cuts
# the connection Ansible is using.
# "limit" denies an address that opens 6+ connections in 30 seconds.
- name: Allow ssh
  community.general.ufw:
    rule: limit
    port: "{{ firewall_ssh_port | string }}"
    proto: tcp
    from_ip: "{{ item }}"
    comment: ssh
  loop: "{{ firewall_ssh_sources }}"

- name: Allow public TCP ports
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
    comment: public
  loop: "{{ firewall_public_tcp_ports }}"

- name: Deny incoming traffic by default
  community.general.ufw:
    direction: incoming
    default: deny

- name: Allow outgoing traffic by default
  community.general.ufw:
    direction: outgoing
    default: allow

- name: Set ufw logging
  community.general.ufw:
    logging: "{{ firewall_logging }}"

- name: Enable ufw
  community.general.ufw:
    state: enabled
