# Ban an address for fail2ban_bantime after fail2ban_maxretry failed ssh
# logins within fail2ban_findtime.
fail2ban_maxretry: 5
fail2ban_findtime: 10m
fail2ban_bantime: 1h
# Repeat offenders get longer bans (1h, 2h, 4h, ... up to a week).
fail2ban_bantime_increment: true
fail2ban_bantime_maxtime: 1w

# Never banned. Loopback always; inventories add the operator's addresses.
fail2ban_ignoreip: []

# Must match ssh_hardening_port.
fail2ban_ssh_port: 22
