# The Vagrant VM (local/Vagrantfile).
#
# Ansible runs in the toolbox container, and Docker Desktop containers
# cannot reach VirtualBox's host-only network (192.168.56.0/24). They can
# reach the workstation itself as host.docker.internal, where Vagrant
# forwards port 2222 to the VM's ssh. The host-only address (vm_ip) is
# what the browser on the workstation uses from Phase 2 on.
all:
  children:
    local:
      hosts:
        uptime-local:
          ansible_host: host.docker.internal
          ansible_port: 2222
          vm_ip: 192.168.56.10
