# The local server: a systemd container on the Docker network uptime-local
# (scripts/local-server.sh, docs/adr/0007). Ansible runs in the toolbox
# container, which joins the same network, and connects over real ssh.
all:
  children:
    local:
      hosts:
        uptime-local:
          ansible_host: 172.30.56.10
          ansible_port: 22
