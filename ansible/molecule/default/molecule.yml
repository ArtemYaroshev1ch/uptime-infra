# Idempotence test of site.yml in CI (docs/adr/0004-ansible-idempotence-in-ci.md).
# `make test` runs: create -> converge (site.yml) -> idempotence (site.yml
# again, must report changed=0) -> verify (verify.yml) -> destroy.
#
# The target is a privileged Ubuntu container with systemd as PID 1, close
# enough to a VM for every role: services start, sshd reloads, ufw writes
# its rules into the container's own network namespace and dockerd runs
# inside it, together with the whole application stack (role stack).
dependency:
  # Collections are baked into the toolbox image.
  name: galaxy
  enabled: false

driver:
  name: docker

platforms:
  - name: uptime-molecule
    image: uptime-molecule-ubuntu:resolute
    dockerfile: Dockerfile.j2
    pre_build_image: false
    privileged: true
    cgroupns_mode: host
    command: /lib/systemd/systemd
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # Docker inside the container needs storage that is not overlayfs.
      - /var/lib/docker
      - /var/lib/containerd

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/roles
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    host_vars:
      uptime-molecule:
        # Talks to the Docker API through the Python SDK; the toolbox has
        # no docker CLI.
        ansible_connection: community.docker.docker_api
    group_vars:
      all:
        ssh_hardening_allowed_users: [deploy]
        # The container shares the kernel of the machine running it.
        common_sysctl_apply: false
        # There is no ssh into the container to try logins over.
        verify_from_controller: false
        # The application stack runs on the Docker engine inside the
        # container. Throwaway values, not secrets: the database lives
        # only as long as the test.
        app_version: 1.0.0
        domain: molecule.invalid
        stack_tls_internal: true
        postgres_password: molecule-only-not-a-secret
        jwt_secret: molecule-only-not-a-secret-at-all-0123456789
  playbooks:
    converge: ../../playbooks/site.yml
    verify: ../../playbooks/verify.yml

verifier:
  name: ansible

scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy
