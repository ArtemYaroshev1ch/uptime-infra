# Read through ANSIBLE_CONFIG=/repo/ansible/ansible.cfg (set in the toolbox
# image), so it applies wherever ansible runs inside the toolbox.
[defaults]
inventory = /repo/ansible/inventories/local/hosts.yml
roles_path = /repo/ansible/roles
collections_path = /usr/share/ansible/collections
# Facts are gathered once per play; no fact cache to go stale.
gathering = implicit
# Readable task results with a diff of every change.
stdout_callback = ansible.builtin.default
result_format = yaml
callback_result_format = yaml
display_skipped_hosts = false
# Ubuntu's python3 is used on every host.
interpreter_python = auto_silent
forks = 10
retry_files_enabled = false

[privilege_escalation]
become_method = ansible.builtin.sudo

[ssh_connection]
# Fewer round trips per task; needs requiretty off in sudoers (the Ubuntu
# default).
pipelining = true
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30
