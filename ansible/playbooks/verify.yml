# Checks the Definition of Done of the host configuration and the
# application stack. Read-only:
# it changes nothing on the host. Used by `make local-verify` and as the
# Molecule verifier.

- name: Verify the host configuration
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Read the effective sshd configuration
      ansible.builtin.command: /usr/sbin/sshd -T
      register: verify_sshd
      changed_when: false

    - name: Assert ssh accepts keys only and no root
      ansible.builtin.assert:
        that:
          - "'permitrootlogin no' in verify_sshd.stdout_lines"
          - "'passwordauthentication no' in verify_sshd.stdout_lines"
          - "'kbdinteractiveauthentication no' in verify_sshd.stdout_lines"
          - "'authenticationmethods publickey' in verify_sshd.stdout_lines"
        quiet: true

    - name: Read the firewall status
      ansible.builtin.command: ufw status verbose
      register: verify_ufw
      changed_when: false

    - name: Assert ufw is active and denies incoming by default
      ansible.builtin.assert:
        that:
          - "'Status: active' in verify_ufw.stdout"
          - "'deny (incoming)' in verify_ufw.stdout"
        quiet: true

    - name: Check the fail2ban sshd jail
      ansible.builtin.command: fail2ban-client status sshd
      changed_when: false

    - name: Check that Docker Compose is installed
      ansible.builtin.command: docker compose version
      changed_when: false

    - name: Run a container
      ansible.builtin.command: docker run --rm busybox:1.37.0 true
      changed_when: false

    # --- Application stack (role stack) -----------------------------------
    - name: List the containers of the stack
      ansible.builtin.command: docker compose --project-name uptime ps --all --format json
      register: verify_stack_ps
      changed_when: false

    - name: Assert every service of the stack runs and is healthy
      vars:
        verify_containers: "{{ verify_stack_ps.stdout_lines | map('from_json') | list }}"
        verify_services: "{{ verify_containers | map(attribute='Service') | list }}"
        verify_unhealthy: >-
          {{ verify_containers | rejectattr('Health', 'eq', 'healthy') | map(attribute='Name') | list }}
      ansible.builtin.assert:
        that:
          - "'postgres' in verify_services"
          - "'worker' in verify_services"
          - "'caddy' in verify_services"
          - verify_services | select('match', '^api-') | list | length > 0
          - verify_containers | rejectattr('State', 'eq', 'running') | list | length == 0
          - verify_unhealthy | length == 0
        fail_msg: "Not running or not healthy: {{ verify_unhealthy }}"
        quiet: true

    # Docker publishes ports with its own iptables rules, past ufw: a
    # published postgres or ops port would be open to the internet even
    # with ufw active. Every container on the host is checked.
    - name: List the published ports of all containers
      ansible.builtin.command: docker ps --format json
      register: verify_docker_ps
      changed_when: false

    - name: Assert only Caddy's 80 and 443 are published
      vars:
        verify_published: >-
          {{ verify_docker_ps.stdout_lines | map('from_json') | map(attribute='Ports')
             | map('regex_findall', ':(\d+)->') | flatten | map('int') | unique | sort }}
      ansible.builtin.assert:
        that: verify_published | difference([80, 443]) | length == 0
        fail_msg: "Published ports besides 80/443: {{ verify_published | difference([80, 443]) }}"
        quiet: true

# Logins that must be refused, tried from the control node like an
# attacker would. Skipped where there is no ssh (Molecule).
- name: Verify refused logins from the control node
  hosts: all
  gather_facts: false
  vars:
    verify_ssh_args: >-
      -o BatchMode=yes -o ConnectTimeout=10 -p {{ ansible_port | default(22) }}
      -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
  tasks:
    # With BatchMode the client never types a password; the server's
    # answer lists the methods it would accept. "(publickey)" alone means
    # passwords are not even offered.
    - name: Try a password login
      ansible.builtin.command: >-
        ssh {{ verify_ssh_args }} -o PubkeyAuthentication=no
        -o PreferredAuthentications=password,keyboard-interactive
        {{ ansible_user }}@{{ ansible_host }} true
      delegate_to: localhost
      register: verify_password_login
      changed_when: false
      failed_when: >-
        verify_password_login.rc != 255 or
        'Permission denied (publickey)' not in verify_password_login.stderr
      when: verify_from_controller | default(true)

    - name: Try a root login with the deploy key
      ansible.builtin.command: >-
        ssh {{ verify_ssh_args }} -i {{ ansible_ssh_private_key_file }}
        root@{{ ansible_host }} true
      delegate_to: localhost
      register: verify_root_login
      changed_when: false
      failed_when: >-
        verify_root_login.rc != 255 or
        'Permission denied' not in verify_root_login.stderr
      when: verify_from_controller | default(true)
