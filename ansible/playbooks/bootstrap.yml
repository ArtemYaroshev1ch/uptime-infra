# First login to a fresh host: create the `deploy` user that every later
# playbook connects as. Runs as root with the key the provider installed
# (a cloud server; the local server gets it from scripts/local-server.sh);
# after site.yml has hardened ssh, root can no longer log in, so this
# playbook is only for fresh hosts.
#
#   make local-bootstrap        # local server (make local-up runs it once)
- name: Bootstrap the deploy user
  hosts: all
  become: true
  vars:
    deploy_user: deploy
    ansible_user: "{{ bootstrap_user }}"
    ansible_ssh_private_key_file: "{{ bootstrap_private_key_file | default(omit) }}"
  tasks:
    - name: Create the deploy user
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        shell: /bin/bash
        create_home: true
        # Locked password: the account logs in with its key only and sudo
        # does not ask for a password (see below).
        password: "!"
        update_password: on_create

    - name: Authorize the deploy key
      ansible.posix.authorized_key:
        user: "{{ deploy_user }}"
        key: "{{ deploy_ssh_public_key }}"
        exclusive: true

    # Ansible needs non-interactive sudo. The account has no password, so
    # the key is the only way in; the trade-off is in ansible/README.md.
    - name: Allow passwordless sudo for the deploy user
      ansible.builtin.copy:
        dest: /etc/sudoers.d/90-deploy
        content: "{{ deploy_user }} ALL=(ALL:ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
